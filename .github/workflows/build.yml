name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (optional)'
        required: false
        type: string
  push:
    branches:
      - master
      - main
      - my-releases

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: "1.98.1"
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Prepare native sources
      env:
        GIT_TERMINAL_PROMPT: '0'
        GCM_INTERACTIVE: 'never'
      run: |
        set -euo pipefail
        echo "::group::submodule status"
        git submodule status || echo "(git submodule status failed)"
        git ls-files -s hev-socks5-tunnel aether AndroidLibXrayLite || true
        echo "::endgroup::"
        fetch_repo () {
          local dir="$1" repo="$2" marker="$3"
          if [ -f "$dir/$marker" ]; then
            echo "$dir: already present"
          else
            echo "$dir: missing $marker, cloning $repo"
            rm -rf "$dir"
            git clone --filter=blob:none --recurse-submodules --shallow-submodules "$repo" "$dir"
          fi
          echo "$dir at $(git -C "$dir" rev-parse HEAD)"
        }
        fetch_repo hev-socks5-tunnel https://github.com/heiher/hev-socks5-tunnel.git third-part/lwip/Android.mk
        fetch_repo aether https://github.com/CluvexStudio/aether.git aether/Cargo.toml
        fetch_repo AndroidLibXrayLite https://github.com/patterniha/AndroidLibXrayLite.git go.mod
        echo "HEVTUN_SHA=$(git -C hev-socks5-tunnel rev-parse HEAD)" >> $GITHUB_ENV
        echo "AETHER_SHA=$(git -C aether rev-parse HEAD)" >> $GITHUB_ENV

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\        ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: libs
        key: libhevtun-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEVTUN_SHA }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      id: libhevtun
      run: |
        set -euo pipefail
        echo "cache-hit: ${{ steps.cache-libhevtun-restore.outputs.cache-hit }}"
        ls -la libs 2>/dev/null || echo "(no libs/ directory)"
        if [ -f libs/arm64-v8a/libhev-socks5-tunnel.so ] && [ -f libs/arm64-v8a/libhevsockstun.so ]; then
          echo "built=false" >> $GITHUB_OUTPUT
        else
          bash compile-hevtun.sh
          echo "built=true" >> $GITHUB_OUTPUT
        fi
        test -f libs/arm64-v8a/libhev-socks5-tunnel.so
        test -f libs/arm64-v8a/libhevsockstun.so

    - name: Save libhevtun
      if: steps.libhevtun.outputs.built == 'true' && steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: libs
        key: libhevtun-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.HEVTUN_SHA }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v4
      with:
        path: libs-aether
        key: libaether-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ env.AETHER_SHA }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      id: libaether
      run: |
        set -euo pipefail
        echo "cache-hit: ${{ steps.cache-libaether-restore.outputs.cache-hit }}"
        ls -la libs-aether 2>/dev/null || echo "(no libs-aether/ directory)"
        if [ -f libs-aether/arm64-v8a/libaether.so ] \
          && [ -f libs-aether/armeabi-v7a/libaether.so ] \
          && [ -f libs-aether/x86_64/libaether.so ]; then
          echo "built=false" >> $GITHUB_OUTPUT
        else
          bash compile-aether.sh
          echo "built=true" >> $GITHUB_OUTPUT
        fi

    - name: Save libaether
      if: steps.libaether.outputs.built == 'true' && steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: libs-aether
        key: libaether-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ env.AETHER_SHA }}-${{ hashFiles('compile-aether.sh') }}

    - name: Copy libhevtun
      run: |
        set -euo pipefail
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        find ${{ github.workspace }}/V2rayNG/app/libs -name '*.so' | sort

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.11
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v1.2
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew :app:testPlaystoreDebugUnitTest
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -PpattngVersion="${{ inputs.release_tag }}" \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/my-releases' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks

      - name: Collect APK files
        run: |
          mkdir -p release-assets
          find apks -type f -name '*.apk' -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || 'continuous' }}
          name: ${{ inputs.release_tag != '' && format('PattNG v{0}', inputs.release_tag) || 'PattNG Continuous Build' }}
          draft: false
          prerelease: false
          files: release-assets/*.apk
