name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - main
      - my-releases

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The stable release aether's own release workflow built with; pinned so a new stable
      # release cannot change or break the release build on its own. Bump it together with
      # the aether submodule.
      RUST_TOOLCHAIN: "1.98.1"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    # The cache path is relative on purpose. With an absolute path actions/cache archives
    # with "tar -P", so the entry carries /home/runner/work/<repo>/<repo> inside it and
    # after a repository rename it still restores "successfully" but unpacks under the old
    # path, leaving the workspace empty. The -v2 in the key drops the entries that were
    # already saved that way.
    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: libs
        key: libhevtun-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    # No "if:" here: a step that is skipped by a cache hit which restored nothing usable
    # only shows up as a failure much later, in the copy step. The check below looks at the
    # files that are actually on disk instead.
    - name: Build libhevtun
      id: libhevtun
      run: |
        set -euo pipefail
        echo "cache-hit: ${{ steps.cache-libhevtun-restore.outputs.cache-hit }}"
        ls -la libs 2>/dev/null || echo "(no libs/ directory)"
        if [ -f libs/arm64-v8a/libhev-socks5-tunnel.so ] && [ -f libs/arm64-v8a/libhevsockstun.so ]; then
          echo "built=false" >> $GITHUB_OUTPUT
        else
          bash compile-hevtun.sh
          echo "built=true" >> $GITHUB_OUTPUT
        fi
        test -f libs/arm64-v8a/libhev-socks5-tunnel.so
        test -f libs/arm64-v8a/libhevsockstun.so

    - name: Save libhevtun
      if: steps.libhevtun.outputs.built == 'true' && steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: libs
        key: libhevtun-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Restore cached libaether
      id: cache-libaether-restore
      uses: actions/cache/restore@v6
      with:
        path: libs-aether
        key: libaether-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Build libaether
      id: libaether
      run: |
        set -euo pipefail
        echo "cache-hit: ${{ steps.cache-libaether-restore.outputs.cache-hit }}"
        ls -la libs-aether 2>/dev/null || echo "(no libs-aether/ directory)"
        if [ -f libs-aether/arm64-v8a/libaether.so ] \
          && [ -f libs-aether/armeabi-v7a/libaether.so ] \
          && [ -f libs-aether/x86_64/libaether.so ]; then
          echo "built=false" >> $GITHUB_OUTPUT
        else
          bash compile-aether.sh
          echo "built=true" >> $GITHUB_OUTPUT
        fi

    - name: Save libaether
      if: steps.libaether.outputs.built == 'true' && steps.cache-libaether-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: libs-aether
        key: libaether-v2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('.git/modules/aether/HEAD') }}-${{ hashFiles('compile-aether.sh') }}

    - name: Copy libhevtun
      run: |
        set -euo pipefail
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs
        cp -r ${{ github.workspace }}/libs/. ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/libs-aether/. ${{ github.workspace }}/V2rayNG/app/libs/
        find ${{ github.workspace }}/V2rayNG/app/libs -name '*.so' | sort

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'patterniha/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.0.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        # The JVM unit tests are the only automated check of the Kotlin logic; a failure stops the
        # build before anything is assembled or signed.
        ./gradlew :app:testPlaystoreDebugUnitTest
        ./gradlew licenseFdroidReleaseReport
        ./gradlew assembleRelease -PpattngVersion="${{ inputs.release_tag }}" -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}
    
    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86 APK
      uses: actions/upload-artifact@v7
      if: ${{  success() }}
      with:
        name: x86-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: universal-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

          gpg --armor --export "$KEY" > release-files/PattNG-public-key.asc

      - name: Upload APKs, signatures and public key to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          release_name: PattNG v${{ inputs.release_tag }}
          body: "."
          target_commit: ${{ github.sha }}
          file_glob: true
          prerelease: true
          overwrite: true
